<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2952cc">
  <meta name="description" content="Personal CFA Level I study planner: progress, flashcards, question bank and timed mock exams.">
  <title>CFA Level I Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main" class="sr-only">Skip to content</a>
  <div class="app">

    <!-- Sidebar: desktop & tablet -->
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark">L1</div>
        <div class="brand-text">
          <div class="brand-name">CFA Study</div>
          <div class="brand-sub">Level I · May 2027</div>
        </div>
      </div>
      <a class="profile-chip" id="profile-chip" href="#/profiles" aria-label="Switch profile"></a>
      <nav class="nav" id="side-nav"></nav>
      <div class="sidebar-foot">
        <div class="text-3 small">Exam countdown</div>
        <strong id="side-days">–</strong>
        <div class="text-2 small" id="side-week"></div>
      </div>
    </aside>

    <div class="main-wrap">
      <!-- Header: mobile only -->
      <header class="mobile-header">
        <div class="brand">
          <div class="brand-mark">L1</div>
          <div class="brand-name">CFA Study</div>
        </div>
        <div class="row-gap">
          <span class="days-chip" id="mobile-days"></span>
          <a href="#/profiles" aria-label="Profiles" id="mobile-profile"></a>
          <a href="#/settings" class="icon-btn" aria-label="Settings" id="mobile-settings"></a>
        </div>
      </header>

      <main id="main" class="main" tabindex="-1">
        <div id="view"></div>
      </main>
    </div>

    <!-- Bottom tabs: mobile only -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation"></nav>
  </div>

  <!-- Order matters: data & helpers first, app.js last -->
  <script src="js/syllabus.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/data/qbank.js"></script>
  <script src="js/data/q-eth.js"></script>
  <script src="js/data/q-eth2.js"></script>
  <script src="js/data/q-qm.js"></script>
  <script src="js/data/q-eco.js"></script>
  <script src="js/data/q-ci.js"></script>
  <script src="js/data/q-fsa.js"></script>
  <script src="js/data/q-eq.js"></script>
  <script src="js/data/q-fi.js"></script>
  <script src="js/data/q-der.js"></script>
  <script src="js/data/q-alt.js"></script>
  <script src="js/data/q-pm.js"></script>
  <script src="js/data/q-2027.js"></script>
  <script src="js/data/q-fsa-ex.js"></script>
  <script src="js/data/q-hard.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/components.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/flashcards.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/data/qbank-files.js"></script>
  <script src="js/qbank-tracker.js"></script>
  <script src="js/qbank-practice.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
